name: Feature request
description: Proponha uma melhoria ou nova construção da linguagem
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problema que a proposta resolve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Sintaxe YuukoLane proposta e Python esperado
      description: Inclua exemplos e possíveis colisões com nomes existentes.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas e impactos de compatibilidade
    validations:
      required: false
